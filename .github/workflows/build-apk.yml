# Compila o APK Release automaticamente a cada push na branch main
# e publica o arquivo na página "Releases" do repositório.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter test
      - run: flutter build apk --release

      - name: Renomear APK
        run: cp build/app/outputs/flutter-apk/app-release.apk portal-academico.apk

      - uses: actions/upload-artifact@v4
        with:
          name: portal-academico-apk
          path: portal-academico.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Portal Acadêmico (build ${{ github.run_number }})
          body: Baixe o arquivo portal-academico.apk abaixo e instale no celular Android.
          files: portal-academico.apk
