name: portal_academico
description: "Portal Acadêmico — app de notas, faltas e horários (front-end com dados mockados)."
publish_to: 'none'

# versão (versionName) + número do build (versionCode)
version: 1.2.0+3

environment:
  sdk: ">=3.7.0 <4.0.0"

# Sem dependências externas: tudo roda com o Flutter SDK puro.
dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Dados mockados (JSON local)
  assets:
    - lib/data/mock_data.json

  # Fonte Poppins embutida (funciona offline)
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
